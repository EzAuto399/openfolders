[package]
name = "openfolders"
version = "0.1.0"
edition = "2021"
description = "iPhone-style folders for the macOS Dock: hover a folder, get its apps in a row above it."
license = "MIT"
repository = "https://github.com/EzAuto399/openfolders"

[dependencies]
tao = "0.30"
wry = { version = "0.47", features = ["transparent"] }
objc = "0.2.7"
cocoa = "0.26"
core-graphics = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5.0"

# The objc 0.2 msg_send! macro checks cfg(feature = "cargo-clippy"); silence that noise.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
